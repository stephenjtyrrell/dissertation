apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dissertation-sample-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stephenjtyrrell/dissertation.git
    targetRevision: main
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: dissertation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
