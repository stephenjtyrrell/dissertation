apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-labels-api
  labels:
    app.kubernetes.io/name: missing-labels-api
    app.kubernetes.io/part-of: dissertation-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-labels-api
  template:
    metadata:
      labels:
        app: missing-labels-api
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
