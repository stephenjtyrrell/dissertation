apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-resources-api
  labels:
    app.kubernetes.io/name: missing-resources-api
    app.kubernetes.io/part-of: dissertation-platform
    owner: platform-team
    compliance: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-resources-api
  template:
    metadata:
      labels:
        app: missing-resources-api
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
